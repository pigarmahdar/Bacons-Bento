version: 1

# Bacon's Bento Editorial Registry 🍱
# A curated registry of sources reflecting personal taste, intellectual curiosity, and aesthetic resonance.

sources:
  # ============================================================================
  # COURSE 1: THE ANCHOR (Philosophy, Metaphysics & Human Interiority)
  # ============================================================================

  - id: aeon
    name: "Aeon"
    type: "rss"
    url: "https://aeon.co/"
    feed_url: "https://aeon.co/feed.rss"
    course: "anchor"
    curatorial_sensibility: "A world of ideas; philosophy, deep time, essays on meaning and metaphysics."
    pillars:
      - "interdisciplinary"
      - "slow-craft"
    taste_profile:
      cognitive_load: "deep_dive"
      cadence: "daily"
      tone: "contemplative"
    tag: "Aeon"
    enabled: true

