  # ============================================================================
  # COURSE 5: THE VISUAL AMBIENT GARNISH (The Met Open Access API)
  # ============================================================================

  - id: met-collection
    name: "The Metropolitan Museum of Art"
    type: "api"
    url: "https://www.metmuseum.org/"
    endpoint: "https://collectionapi.metmuseum.org/public/collection/v1"
    course: "visual_garnish"
    curatorial_sensibility: "Curated CC0 art across fine art, antiquities, prints, and photography."
    pillars:
      - "foreign-and-strange"
      - "slow-craft"
      - "optimism"
    taste_profile:
      cognitive_load: "snack"
      cadence: "daily"
      tone: "aesthetic-serene"
    tag: "TheMet"
    config:
      department_ids:
        - 3   # Ancient West Asian Art
        - 5   # Arts of Africa, Oceania, and the Americas
        - 6   # Asian Art
        - 9   # Drawings and Prints
        - 10  # Egyptian Art
        - 11  # European Paintings
        - 13  # Greek and Roman Art
        - 14  # Islamic Art
        - 15  # The Robert Lehman Collection
        - 16  # The Libraries
        - 17  # Medieval Art
        - 19  # Photographs
        - 21  # Modern Art
      require_highlight: true
      require_image: true
    enabled: true
